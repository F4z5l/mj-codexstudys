<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Wallah - Content</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-20">
    <nav class="h-20 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 flex items-center justify-between px-6 sticky top-0 z-30 shadow-sm">
        <div class="flex items-center gap-3">
            <button onclick="history.back()" class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-blue-400 hover:bg-slate-700 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div>
                <h1 class="font-extrabold text-white text-lg tracking-tight">Lectures & Content</h1>
                <p class="text-xs font-semibold text-blue-400">Explore Videos & Notes</p>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 pt-6">
        <div id="tabsContainer" class="flex gap-3 overflow-x-auto hide-scrollbar pb-2">
            <button onclick="changeTab('LECTURES', this)" class="tab-btn px-5 py-2.5 rounded-xl bg-blue-600 text-white text-sm font-extrabold shadow-md shadow-blue-600/30 transition-all flex-shrink-0">Lectures</button>
            <button onclick="changeTab('NOTES', this)" class="tab-btn px-5 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 text-sm font-extrabold shadow-sm transition-all flex-shrink-0">Notes</button>
            <button onclick="changeTab('DPP_PDF', this)" class="tab-btn px-5 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 text-sm font-extrabold shadow-sm transition-all flex-shrink-0">DPP</button>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-6 py-6">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-base font-extrabold text-white">Available Items</h3>
            <span id="contentCount" class="text-xs font-bold text-slate-400 bg-slate-900 px-3 py-1 rounded-lg border border-slate-800 shadow-sm">Loading...</span>
        </div>

        <div id="contentContainer" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
            <div class="col-span-full flex flex-col items-center justify-center py-16">
                <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
                <p class="text-sm font-bold text-slate-400">Loading contents...</p>
            </div>
        </div>

        <div id="loadMoreContainer" class="mt-8 text-center hidden">
            <button id="loadMoreBtn" onclick="loadMore()" class="bg-slate-900 border border-slate-800 text-blue-400 px-6 py-3 rounded-xl font-extrabold text-sm shadow-sm hover:bg-slate-800 transition">Load More</button>
        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const bId = params.get("batchId"), sId = params.get("subjectId"), tId = params.get("topicId");
        let currentTab = 'LECTURES', currentPage = 1;

        function cleanTitle(title) {
            return title.split('||')[0].replace(/Class Notes|Concise Summary Notes|NCERT Discussion Notes|Handwritten Notes/gi, '').trim();
        }

        async function fetchContent(page) {
            const url = `https://devcoderz-backend.vercel.app/api/lectures?batchSlug=${bId}&subjectSlug=${sId}&contentType=${currentTab}&tag=${tId}&page=${page}`;
            const res = await fetch(url);
            const json = await res.json();
            if (json.encryptedData) {
                const decodedString = decodeURIComponent(escape(atob(json.encryptedData)));
                return JSON.parse(decodedString);
            }
            return json;
        }

        async function openDocument(scheduleId) {
            try {
                const url = `https://devcoderz-backend.vercel.app/api/notes?batchId=${bId}&subjectSlug=${sId}&scheduleId=${scheduleId}`;
                const res = await fetch(url);
                const json = await res.json();
                const data = json.data || json;

                let fileUrl = '#';
                if (data.homeworkIds && data.homeworkIds.length > 0 && data.homeworkIds[0].attachmentIds && data.homeworkIds[0].attachmentIds.length > 0) {
                    const att = data.homeworkIds[0].attachmentIds[0];
                    fileUrl = att.baseUrl + att.key;
                } else if (data.dpp && data.dpp.homeworkIds && data.dpp.homeworkIds.length > 0 && data.dpp.homeworkIds[0].attachmentIds && data.dpp.homeworkIds[0].attachmentIds.length > 0) {
                    const att = data.dpp.homeworkIds[0].attachmentIds[0];
                    fileUrl = att.baseUrl + att.key;
                }

                if (fileUrl !== '#') {
                    window.open(fileUrl, '_blank');
                } else {
                    alert('Document URL not found');
                }
            } catch (e) {
                alert('Failed to load document');
            }
        }

        async function loadContent(isLoadMore = false) {
            if (!isLoadMore) currentPage = 1;
            const container = document.getElementById('contentContainer');
            const countBadge = document.getElementById('contentCount');

            if (!isLoadMore) {
                container.innerHTML = '<div class="col-span-full flex flex-col items-center justify-center py-16"><div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div><p class="text-sm font-bold text-slate-400">Loading contents...</p></div>';
            }

            try {
                const json = await fetchContent(currentPage);
                const items = json.data || [];
                if (!isLoadMore) container.innerHTML = '';

                if (items.length === 0 && !isLoadMore) {
                    countBadge.innerText = '0 Items';
                    container.innerHTML = '<div class="col-span-full text-center py-16 text-slate-400 font-semibold bg-slate-900 rounded-2xl border border-slate-800">No content available.</div>';
                    document.getElementById('loadMoreContainer').classList.add('hidden');
                    return;
                }

                countBadge.innerText = `${items.length} Items`;

                items.forEach(item => {
                    const itemData = item.data || item;
                    const card = document.createElement('div');
                    card.className = "bg-slate-900 rounded-2xl border border-slate-800 shadow-sm hover:shadow-xl hover:border-blue-500/50 transition-all duration-300 p-5 flex flex-col justify-between group";

                    if (currentTab === 'LECTURES') {
                        const lId = itemData.lectureId || itemData._id;
                        const topicName = itemData.topic || (itemData.videoDetails && itemData.videoDetails.name) || 'Untitled Lecture';
                        const videoImg = (itemData.videoDetails && itemData.videoDetails.image) || 'https://via.placeholder.com/150';
                        const lectureType = itemData.lectureType || 'Lecture';

                        card.innerHTML = `
                            <div>
                                <div class="w-full h-36 rounded-xl bg-slate-950 border border-slate-800 overflow-hidden mb-4 flex items-center justify-center relative">
                                    <img src="${videoImg}" alt="${topicName}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="this.src='https://via.placeholder.com/150'">
                                    <span class="absolute bottom-2 right-2 bg-black/80 text-white text-[10px] font-extrabold px-2 py-1 rounded-lg backdrop-blur-sm">${lectureType}</span>
                                </div>
                                <h4 class="font-bold text-white text-base mb-2 group-hover:text-blue-400 transition-colors line-clamp-2">${topicName}</h4>
                            </div>
                            <button class="w-full mt-4 bg-blue-600 text-white py-2.5 rounded-xl text-sm font-extrabold shadow-md shadow-blue-600/30 hover:bg-blue-700 transition flex items-center justify-center gap-2" onclick="watchLecture('${bId}', '${sId}', '${lId}')">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                Watch Lecture
                            </button>
                        `;
                    } else {
                        const schedId = item._id || itemData._id;
                        const hw = (itemData.homeworkIds || [])[0];
                        const title = hw ? cleanTitle(hw.topic || 'Untitled Note') : cleanTitle(itemData.topic || 'Untitled Note');

                        card.innerHTML = `
                            <div class="flex items-center gap-4 mb-4">
                                <div class="w-14 h-14 rounded-xl bg-slate-950 border border-slate-800 flex-shrink-0 flex items-center justify-center text-blue-400">
                                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <span class="inline-block bg-blue-950 text-blue-400 text-[10px] font-extrabold px-2 py-0.5 rounded-full mb-1 border border-blue-900/50">DOCUMENT</span>
                                    <h4 class="font-bold text-white text-sm group-hover:text-blue-400 transition-colors line-clamp-2">${title}</h4>
                                </div>
                            </div>
                            <button class="w-full bg-slate-950 border border-slate-800 text-blue-400 py-2.5 rounded-xl text-sm font-extrabold hover:bg-slate-800 transition flex items-center justify-center gap-2" onclick="openDocument('${schedId}')">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                                View Document
                            </button>
                        `;
                    }
                    container.appendChild(card);
                });
                document.getElementById('loadMoreContainer').classList.toggle('hidden', items.length < 20);
            } catch (e) {
                document.getElementById('contentCount').innerText = 'Error';
                container.innerHTML = '<div class="col-span-full text-center py-16 text-rose-500 font-semibold bg-slate-900 rounded-2xl border border-slate-800">Failed to load content.</div>';
            }
        }

        function loadMore() { currentPage++; loadContent(true); }

        function changeTab(tab, btn) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('bg-blue-600', 'text-white', 'shadow-md', 'shadow-blue-600/30');
                b.classList.add('bg-slate-900', 'border', 'border-slate-800', 'text-slate-300', 'shadow-sm');
            });
            btn.classList.add('bg-blue-600', 'text-white', 'shadow-md', 'shadow-blue-600/30');
            btn.classList.remove('bg-slate-900', 'border', 'border-slate-800', 'text-slate-300', 'shadow-sm');
            loadContent();
        }

        function watchLecture(batchId, subjectId, lectureId) {
            window.location.href = `player?batchId=${batchId}&subjectId=${subjectId}&lectureId=${lectureId}`;
        }

        loadContent();
    </script>
</body>
</html>
