<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        .player-container {
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <iframe id="marcoPlayer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const batchId = params.get('batchId') || '';
        const subjectId = params.get('subjectId') || '';
        const topicId = params.get('topicId') || '';
        const lectureId = params.get('lectureId') || '';
        const typeId = params.get('typeId') || '';
        const videoUrl = encodeURIComponent(params.get('videoUrl') || '');
        const videoName = encodeURIComponent(params.get('videoName') || '');
        const videoImg = encodeURIComponent(params.get('videoImg') || '');

        if (batchId && subjectId && lectureId) {
            const dynamicUrl = `https://vid-stream-marco.vercel.app/play.php?batch_id=${batchId}&program_id=&subject_id=${subjectId}&topic_id=${topicId}&video_id=${lectureId}&typeId=${typeId}&video_url=${videoUrl}&video_name=${videoName}&video_img=${videoImg}&video_type=new&play_type=Live`;
            document.getElementById('marcoPlayer').src = dynamicUrl;
        } else {
            document.body.innerHTML = '<div style="color:white; text-align:center; padding-top:20vh; font-family:sans-serif;"><h2>Error: Missing Player IDs!</h2></div>';
        }
    </script>
</body>
</html>
