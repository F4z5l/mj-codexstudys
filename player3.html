<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #playerContainer {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #marcoPlayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .back-button-blocker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; 
            height: 50px; 
            background-color: black;
            z-index: 10;
            pointer-events: auto;
        }

        :fullscreen .back-button-blocker {
            display: none;
        }
        :-webkit-full-screen .back-button-blocker {
            display: none;
        }
    </style>
</head>
<body class="bg-black fixed inset-0 w-screen h-screen overflow-hidden flex flex-col m-0 p-0">
    <div id="playerContainer">
        <div class="back-button-blocker"></div>

        <iframe 
            id="marcoPlayer"
            src="" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen>
        </iframe>
    </div>
    <script>
        const pathQuery = window.location.search.replace('?', '');
        const parts = pathQuery.split('/');
        
        if (parts.length >= 3) {
            const batchPart = parts[0].split('=');
            const subjectPart = parts[1].split('=');
            const videoPart = parts[2].split('=');

            const batchId = batchPart[1] || parts[0];
            const subjectId = subjectPart[1] || parts[1];
            const videoId = videoPart[1] || parts[2];

            const marcoUrl = `https://pw-player.ai.studio/?batch_id=${batchId}&subject_id=${subjectId}&child_id=${videoId}`;
            document.getElementById('marcoPlayer').src = marcoUrl;
        } else {
            document.body.innerHTML = '<div class="text-white flex items-center justify-center h-full font-bold">Invalid Video Parameters!</div>';
        }
    </script>
</body>
</html>
