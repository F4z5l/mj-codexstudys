<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Wallah - Chapters</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-20">
    <nav class="h-20 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 flex items-center justify-between px-6 sticky top-0 z-30 shadow-sm">
        <div class="flex items-center gap-3">
            <button id="backBtn" class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-blue-400 hover:bg-slate-700 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div>
                <h1 id="pageTitle" class="font-extrabold text-white text-lg tracking-tight">Select Chapter</h1>
                <p id="subjectSubtitle" class="text-xs font-semibold text-blue-400">Loading details...</p>
            </div>
        </div>
        <div class="text-xs text-blue-400 bg-blue-950 px-3 py-1.5 rounded-xl border border-blue-900/50 font-extrabold hidden sm:block">Vault Active</div>
    </nav>

    <div class="max-w-5xl mx-auto px-6 pt-6">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 mb-6 flex items-center justify-between shadow-sm">
            <div>
                <span class="inline-block bg-blue-950 text-blue-400 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full mb-1 border border-blue-900/50">CURRICULUM</span>
                <h2 id="batchSubjectHeading" class="text-base font-extrabold text-white">Chapters & Modules</h2>
            </div>
            <span id="chapterCount" class="text-xs font-bold text-slate-400 bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800 shadow-sm">Loading...</span>
        </div>
    </div>

    <main class="max-w-5xl mx-auto px-6">
        <div id="chaptersContainer" class="space-y-3">
            <div class="bg-slate-950 p-5 border border-slate-800 rounded-2xl animate-pulse h-16 shadow-sm"></div>
            <div class="bg-slate-950 p-5 border border-slate-800 rounded-2xl animate-pulse h-16 shadow-sm"></div>
            <div class="bg-slate-950 p-5 border border-slate-800 rounded-2xl animate-pulse h-16 shadow-sm"></div>
        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const bId = params.get('batch_id');
        const sId = params.get('subject_id');
        const sSlug = params.get('subject_slug') || "subject-slug";
        const bName = params.get('batchName') || "Batch";
        const sName = params.get('subjectName') || "Subject";

        if (!bId || !sId) { window.location.href = "./index.html"; }

        document.getElementById('backBtn').onclick = () => { window.history.back(); };
        document.getElementById('subjectSubtitle').innerText = `${sName} • ${bName}`;
        document.getElementById('batchSubjectHeading').innerText = sName;

        async function loadChapters() {
            const container = document.getElementById('chaptersContainer');
            const countBadge = document.getElementById('chapterCount');
            const targetApi = `https://devcoderz-backend.vercel.app/api/chapters?batchId=${encodeURIComponent(bId)}&subjectId=${encodeURIComponent(sId)}`;

            try {
                const res = await fetch(targetApi);
                const resData = await res.json();
                let chapters = resData.topics || [];

                if (chapters.length === 0) {
                    countBadge.innerText = '0 Chapters';
                    container.innerHTML = `<div class="text-center text-slate-400 font-semibold py-16 bg-slate-900 rounded-2xl border border-slate-800">No chapters found.</div>`;
                    return;
                }

                countBadge.innerText = `${chapters.length} Chapters`;

                container.innerHTML = chapters.map((c, index) => `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-sm hover:shadow-xl hover:border-blue-500/50 transition-all duration-300 cursor-pointer flex items-center justify-between group" 
                         onclick="openLectures('${c.slug}', '${encodeURIComponent(c.name)}', '${c.topicId || c._id}')">
                        <div class="flex items-center gap-4 min-w-0">
                            <div class="w-10 h-10 rounded-xl bg-slate-950 border border-slate-800 flex-shrink-0 flex items-center justify-center text-blue-400 font-extrabold text-sm">
                                ${index + 1}
                            </div>
                            <div class="min-w-0">
                                <span class="text-[10px] font-extrabold text-slate-500 uppercase tracking-wider block mb-0.5">Chapter ${index + 1}</span>
                                <h4 class="font-bold text-white text-sm sm:text-base group-hover:text-blue-400 transition-colors truncate">${c.name}</h4>
                            </div>
                        </div>
                        <div class="w-9 h-9 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-center text-blue-400 group-hover:bg-blue-600 group-hover:text-white group-hover:border-blue-500 transition-all ml-3 flex-shrink-0">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                countBadge.innerText = 'Error';
                container.innerHTML = `<div class="text-center text-rose-500 font-semibold py-16 bg-slate-900 rounded-2xl border border-slate-800">Failed to load chapters.</div>`;
            }
        }

        function openLectures(tSlug, tName, tId) {
            window.location.href = `./lectures.html?batchId=${bId}&batchName=${encodeURIComponent(bName)}&subjectId=${sId}&subjectSlug=${sSlug}&subjectName=${encodeURIComponent(sName)}&chapterSlug=${tSlug}&chapterName=${tName}&topicId=${tId}`;
        }

        if (bId && sId) loadChapters();
    </script>
</body>
</html>
