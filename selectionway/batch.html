<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Selection Way - Batch Details</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#fdfbf7;color:#333;min-height:100vh;display:flex;flex-direction:column}
header{background:#fff;padding:16px 20px;box-shadow:0 2px 8px rgba(139,69,19,.08);position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0e6d2}
.brand{font-size:20px;font-weight:800;color:#8B4513;letter-spacing:0.5px}
.brand span{color:#D2B48C}
.devcoderz-brand{font-size:12px;font-weight:700;color:#8B4513;background:#f5ebe0;padding:4px 10px;border-radius:20px;border:1px solid #e3d2bc;box-shadow:0 1px 3px rgba(139,69,19,.06)}

.container{max-width:1000px;margin:20px auto;padding:0 16px;flex:1;width:100%}
.banner{width:100%;height:200px;background:#f5ebe0;border-radius:14px;object-fit:cover;margin-bottom:16px;border:1px solid #f3e9dc}
.course-title{font-size:20px;font-weight:800;color:#2c1810;margin-bottom:6px}
.course-desc{font-size:13px;color:#7a6b63;margin-bottom:16px;line-height:1.5}

/* Tabs */
.tabs{display:flex;gap:10px;border-bottom:2px solid #f0e6d2;margin-bottom:20px}
.tab-btn{background:none;border:none;padding:10px 16px;font-size:14px;font-weight:700;color:#a89f91;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:0.2s}
.tab-btn.active{color:#8B4513;border-bottom-color:#8B4513}

.tab-content{display:none}
.tab-content.active{display:block}

/* Folder / Accordion styling */
.folder-container{margin-bottom:12px;border:1px solid #f3e9dc;border-radius:12px;background:#fff;overflow:hidden;box-shadow:0 2px 8px rgba(139,69,19,.03)}
.folder-header{padding:14px 16px;background:#fcf9f4;color:#8B4513;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid transparent;transition:background 0.2s}
.folder-header:hover{background:#f7efe3}
.folder-header.active{border-bottom-color:#f3e9dc;background:#f5ebe0}
.folder-icon{font-size:14px;transition:transform 0.3s ease}
.folder-header.active .folder-icon{transform:rotate(180deg)}

.folder-content{max-height:0;overflow:hidden;transition:max-height 0.3s ease-in-out;padding:0 16px;background:#fff}
.folder-content.open{padding:12px 16px;max-height:2000px}

/* Cards */
.card{background:#fdfbf7;border-radius:10px;padding:14px;margin-bottom:10px;border:1px solid #f0e6d2}
.item-title{font-size:14px;font-weight:700;color:#2c1810;margin-bottom:4px}
.item-sub{font-size:12px;color:#7a6b63;margin-bottom:8px}
.btn-action{display:inline-block;background:#8B4513;color:#fff;text-decoration:none;padding:6px 12px;font-size:11px;font-weight:700;border-radius:6px;transition:background 0.2s;cursor:pointer;border:none}
.btn-action:hover{background:#6b3410}

.loader{text-align:center;padding:40px;font-size:14px;color:#8B4513}
footer{background:#fff;border-top:1px solid #f0e6d2;text-align:center;padding:16px;margin-top:40px}
footer .jsr{color:#ff9800;font-weight:700;font-size:13px;margin-bottom:4px}
footer .dev{font-size:12px;font-weight:600;color:#8B4513;background:#f5ebe0;display:inline-block;padding:4px 12px;border-radius:20px;border:1px solid #e3d2bc;margin-top:4px}
</style>
</head>
<body>

<header>
 <div class="brand" style="cursor:pointer" onclick="location.href='index.html'">Selection <span>Way</span></div>
 <div class="devcoderz-brand">DevCoderZ</div>
</header>

<div class="container">
 <div id="loader" class="loader">Loading batch details...</div>
 <div id="mainContent" style="display:none">
  <img id="courseBanner" class="banner" src="" alt="Banner">
  <div class="course-title" id="courseTitle"></div>
  <div class="course-desc" id="courseDesc"></div>

  <!-- Tabs Header -->
  <div class="tabs">
   <button class="tab-btn active" onclick="switchTab('overview', this)">Overview</button>
   <button class="tab-btn" onclick="switchTab('notes', this)">Notes (PDFs)</button>
   <button class="tab-btn" onclick="switchTab('videos', this)">Videos</button>
  </div>

  <!-- Overview Tab -->
  <div id="overview" class="tab-content active">
   <div class="card">
    <div class="item-title">Batch Highlights</div>
    <ul id="highlightsList" style="padding-left:20px;font-size:13px;color:#5c3a21;line-height:1.6"></ul>
   </div>
   <div class="card">
    <div class="item-title">Faculty Information</div>
    <p id="facultyInfo" style="font-size:13px;color:#5c3a21;line-height:1.5"></p>
   </div>
  </div>

  <!-- Notes Tab -->
  <div id="notes" class="tab-content">
   <div id="notesList">Loading notes...</div>
  </div>

  <!-- Videos Tab -->
  <div id="videos" class="tab-content">
   <div id="videosList">Loading classes...</div>
  </div>
 </div>
</div>

<footer>
 <div class="jsr">🚩 Jai Shree Ram 🚩</div>
 <div><span class="dev">Developed by - Devansh Sharma (The DevCoderZ)</span></div>
</footer>

<script>
const urlParams = new URLSearchParams(window.location.search);
const courseId = urlParams.get('id') || '6a4e376d5bac0ae4bab5a040';

function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
}

async function loadBatchData() {
    try {
        // 1. Fetch Course Info (Overview)
        const res = await fetch(`https://devcoderz-sw.vercel.app/api/hehe?path=courses/${courseId}`);
        const json = await res.json();

        if(json && json.data) {
            let data = json.data;
            document.getElementById('courseBanner').src = data.banner || data.bannerSquare || '';
            document.getElementById('courseTitle').innerText = data.title;
            document.getElementById('courseDesc').innerText = Array.isArray(data.description) ? data.description.join(' | ') : (data.description || '');

            const highlights = document.getElementById('highlightsList');
            highlights.innerHTML = '';
            (data.courseHighlights || []).forEach(h => {
                let li = document.createElement('li');
                li.innerText = h;
                highlights.appendChild(li);
            });

            if(data.facultyDetails) {
                document.getElementById('facultyInfo').innerHTML = `<b>${data.facultyDetails.name}</b> (${data.facultyDetails.designation})<br>${data.facultyDetails.description || data.facultyDetails.bio || ''}`;
            }
        }

        // 2. Fetch PDFs (Notes) grouped by topics with folder accordion support
        try {
            const pdfRes = await fetch(`https://devcoderz-sw.vercel.app/api/hehe?path=courses/${courseId}/pdfs&groupBy=topic`);
            const pdfJson = await pdfRes.json();
            const notesContainer = document.getElementById('notesList');
            notesContainer.innerHTML = '';

            let topicsArr = (pdfJson && pdfJson.data && Array.isArray(pdfJson.data.topics)) ? pdfJson.data.topics : [];

            if(topicsArr.length > 0) {
                topicsArr.forEach((group, index) => {
                    let folderDiv = document.createElement('div');
                    folderDiv.className = 'folder-container';

                    let headerDiv = document.createElement('div');
                    headerDiv.className = 'folder-header' + (index === 0 ? ' active' : '');
                    headerDiv.innerHTML = `<span>📁 ${group.topicName || 'Notes'}</span> <span class="folder-icon">▼</span>`;

                    let contentDiv = document.createElement('div');
                    contentDiv.className = 'folder-content' + (index === 0 ? ' open' : '');

                    headerDiv.onclick = () => {
                        headerDiv.classList.toggle('active');
                        contentDiv.classList.toggle('open');
                    };

                    if(group.pdfs && group.pdfs.length > 0) {
                        group.pdfs.forEach(pdf => {
                            let card = document.createElement('div');
                            card.className = 'card';
                            card.innerHTML = `
                                <div class="item-title">${pdf.title}</div>
                                <div class="item-sub">${pdf.description || ''}</div>
                                <a class="btn-action" href="${pdf.uploadPdf}" target="_blank" rel="noopener noreferrer">View PDF</a>
                            `;
                            contentDiv.appendChild(card);
                        });
                    } else {
                        contentDiv.innerHTML = '<div class="card">No PDFs available in this section.</div>';
                    }

                    folderDiv.appendChild(headerDiv);
                    folderDiv.appendChild(contentDiv);
                    notesContainer.appendChild(folderDiv);
                });
            } else {
                notesContainer.innerHTML = '<div class="card">No notes available.</div>';
            }
        } catch(err) {
            document.getElementById('notesList').innerHTML = '<div class="card">Failed to load notes.</div>';
        }

        // 3. Fetch Videos / Classes as Folders (Accordions)
        try {
            const vidRes = await fetch(`https://devcoderz-sw.vercel.app/api/hehe?path=courses/${courseId}/classes&populate=full`);
            const vidJson = await vidRes.json();
            const videosContainer = document.getElementById('videosList');
            videosContainer.innerHTML = '';

            let topicsGroup = (vidJson && vidJson.data && Array.isArray(vidJson.data.classes)) ? vidJson.data.classes : [];

            if(topicsGroup.length > 0) {
                topicsGroup.forEach((group, index) => {
                    let folderDiv = document.createElement('div');
                    folderDiv.className = 'folder-container';

                    let headerDiv = document.createElement('div');
                    headerDiv.className = 'folder-header' + (index === 0 ? ' active' : '');
                    headerDiv.innerHTML = `<span>📁 ${group.topicName || 'Classes'}</span> <span class="folder-icon">▼</span>`;

                    let contentDiv = document.createElement('div');
                    contentDiv.className = 'folder-content' + (index === 0 ? ' open' : '');

                    headerDiv.onclick = () => {
                        headerDiv.classList.toggle('active');
                        contentDiv.classList.toggle('open');
                    };

                    if(group.classes && group.classes.length > 0) {
                        group.classes.forEach(cls => {
                            let streamUrl = cls.class_link || '';
                            if(!streamUrl && cls.mp4Recordings && cls.mp4Recordings.length > 0) {
                                streamUrl = cls.mp4Recordings[0].url;
                            }

                            let card = document.createElement('div');
                            card.className = 'card';
                            card.innerHTML = `
                                <div class="item-title">${cls.title}</div>
                                <div class="item-sub">Teacher: ${cls.teacherName || 'Faculty'} | Duration: ${cls.duration ? Math.floor(cls.duration/60) + ' mins' : 'N/A'}</div>
                                <a class="btn-action" href="${streamUrl}" target="_blank" rel="noopener noreferrer">Watch Class</a>
                            `;
                            contentDiv.appendChild(card);
                        });
                    } else {
                        contentDiv.innerHTML = '<div class="card">No classes in this folder.</div>';
                    }

                    folderDiv.appendChild(headerDiv);
                    folderDiv.appendChild(contentDiv);
                    videosContainer.appendChild(folderDiv);
                });
            } else {
                videosContainer.innerHTML = '<div class="card">No classes available.</div>';
            }
        } catch(err) {
            document.getElementById('videosList').innerHTML = '<div class="card">Failed to load classes.</div>';
        }

        document.getElementById('loader').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';

    } catch(e) {
        document.getElementById('loader').innerText = "Failed to load batch data.";
    }
}

loadBatchData();
</script>

</body>
</html>
